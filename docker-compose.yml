version: '3.8'

services:
  evolution_api:
    image: iwebconsultants/evolution-api:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/evolution_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - evolution-network

  evolution_frontend:
    image: evolution_frontend_image:latest  # Replace with actual frontend image
    environment:
      - NODE_ENV=production
      - API_URL=http://evolution_api:8080
    ports:
      - "3001:3000"  # Changed from 3000:3000 to avoid port conflict
    networks:
      - evolution-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - evolution-network

  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=evolution_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-network

volumes:
  postgres_data:

networks:
  evolution-network:
    driver: bridge
